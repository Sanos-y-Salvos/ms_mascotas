services:
  ms-mascotas:
    image: lucianobc/ms-mascotas:latest
    # build: .
    container_name: ms-mascotas
    restart: unless-stopped
    ports:
      - '3003:3003' # Expuesto temporalmente si necesitas hacer pruebas directas sin el Gateway
    environment:
      PORT: 3003
      NODE_ENV: development
      DB_HOST: postgres-mascotas
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: ms_mascotas
      # Ahora apunta al RabbitMQ que vive en la red compartida
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672 
      RABBITMQ_EXCHANGE: sanos_y_salvos_events
      JWT_SECRET: supersecreto_cambiar_en_produccion
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 5
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres-mascotas:
        condition: service_healthy
      # Eliminamos el depends_on de rabbitmq, porque se asume que ya lo encendiste en la carpeta infraestructura
    networks:
      - db-mascotas-net     # Red privada para su BD
      - sanos-y-salvos-net  # Red pública para Gateway y RabbitMQ

  postgres-mascotas:
    image: postgres:15-alpine
    container_name: postgres-mascotas
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ms_mascotas
    ports:
      - '5432:5432' # Expuesto a tu PC por si usas DBeaver/pgAdmin
    volumes:
      - pg_mascotas_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-mascotas-net # ¡Nota esto! La BD NO está en la red pública. Está aislada y segura.

volumes:
  pg_mascotas_data:
  uploads_data:

networks:
  sanos-y-salvos-net:
    external: true
    name: mascotas_sanos-y-salvos-net
  db-mascotas-net:
    driver: bridge
    name: db-mascotas-net # Red local exclusiva para este microservicio